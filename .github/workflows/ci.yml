name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  comments:
    uses: delphi-modernizer/.github/.github/workflows/comment-lint.yml@b4e362bb70af1ac86b6501accce2edf69e47b401
    with:
      standards-ref: b4e362bb70af1ac86b6501accce2edf69e47b401

  drift:
    uses: delphi-modernizer/.github/.github/workflows/standards-drift.yml@b4e362bb70af1ac86b6501accce2edf69e47b401
    with:
      standards-ref: b4e362bb70af1ac86b6501accce2edf69e47b401
      files: |
        .editorconfig=standards/csharp/.editorconfig
        tests/.editorconfig=standards/csharp/tests.editorconfig
        docs/COMMENTS.md=COMMENTS.md
        docs/csharp-style.md=standards/csharp/csharp-style.md

  dependencies:
    uses: delphi-modernizer/.github/.github/workflows/dependency-review.yml@b4e362bb70af1ac86b6501accce2edf69e47b401

  # The engine release engine.lock names: the build job tests against its source, and the package job takes dmz from it
  # (docs/BUILDING.md).
  engine:
    runs-on: ubuntu-latest
    outputs:
      ref: ${{ steps.lock.outputs.ref }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: lock
        run: echo "ref=$(tr -d '[:space:]' < engine.lock)" >> "$GITHUB_OUTPUT"

  python:
    uses: delphi-modernizer/.github/.github/workflows/python-ci.yml@b4e362bb70af1ac86b6501accce2edf69e47b401
    with:
      sources: scripts

  build:
    needs: engine
    uses: delphi-modernizer/.github/.github/workflows/dotnet-ci.yml@b4e362bb70af1ac86b6501accce2edf69e47b401
    with:
      solution: DelphiModernizer.Studio.slnx
      os: '["windows-latest"]'
      submodules: 'true'
      companion-repository: delphi-modernizer/engine
      companion-ref: ${{ needs.engine.outputs.ref }}
      companion-path: .engine
      sonar-organization: delphi-modernizer
      sonar-project-key: delphi-modernizer_studio
      sonar-exclusions: .engine/**
      sonar-coverage-exclusions: src/App/**,src/**/*.UI/**,src/**/*.UI.*/**
    secrets:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

  # The app on the engine's packages, with dmz beside it and the Windows App SDK runtime inside, so the artifact runs
  # on a clean PC.
  package:
    needs: [engine, build]
    runs-on: windows-latest
    permissions:
      contents: read
      packages: read
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: "1"
      DOTNET_NOLOGO: "1"
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: delphi-modernizer/engine
          ref: ${{ needs.engine.outputs.ref }}
          path: .engine
          submodules: true
          persist-credentials: false
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          global-json-file: global.json
      # GitHub Packages needs a token even for public packages, and each engine package grants this repository read.
      # The credentials go to the user-level NuGet configuration, outside the checkout.
      - name: Sign in to the engine's packages
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: dotnet nuget update source delphi-modernizer --username "$GITHUB_ACTOR" --password "$GITHUB_TOKEN"
      - name: Publish the studio
        run: >-
          dotnet publish src/App/DelphiModernizer.Studio.App
          -c Release -r win-x64 -p:Platform=x64 -p:EngineSource=Package --self-contained -o out/studio
      - name: Publish dmz beside it
        run: >-
          dotnet publish .engine/src/DelphiModernizer.Cli
          -c Release -r win-x64 --self-contained -p:PublishSingleFile=true -o out/studio/tools
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: delphi-modernizer-studio-win-x64
          path: out/studio
          if-no-files-found: error

  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # A Private Use Area character is invisible in editors and diffs; glyphs are written as escapes.
      - name: Require icon glyphs to be written as escapes
        run: |
          if grep -rnP '[\x{E000}-\x{F8FF}]' --include='*.cs' --include='*.xaml' src tests; then exit 1; fi
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: '0.13.6'
      - name: Require the committed icon font to match its sources
        run: |
          uv run --frozen --no-build python scripts/build_icon_font.py
          git diff --exit-code -- src
      - name: Lint the Markdown
        run: |
          npm install --global --ignore-scripts markdownlint-cli2@0.24.0
          markdownlint-cli2
