name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  comments:
    uses: delphi-modernizer/.github/.github/workflows/comment-lint.yml@78374692c4c7d78c93f578e43b262ca7818bdfb0
    with:
      standards-ref: 78374692c4c7d78c93f578e43b262ca7818bdfb0

  drift:
    uses: delphi-modernizer/.github/.github/workflows/standards-drift.yml@78374692c4c7d78c93f578e43b262ca7818bdfb0
    with:
      standards-ref: 78374692c4c7d78c93f578e43b262ca7818bdfb0
      files: |
        .editorconfig=standards/csharp/.editorconfig
        tests/.editorconfig=standards/csharp/tests.editorconfig
        docs/COMMENTS.md=COMMENTS.md
        docs/csharp-style.md=standards/csharp/csharp-style.md

  dependencies:
    uses: delphi-modernizer/.github/.github/workflows/dependency-review.yml@78374692c4c7d78c93f578e43b262ca7818bdfb0

  # The engine is built from source at the commit engine.lock pins (docs/BUILDING.md).
  engine:
    runs-on: ubuntu-latest
    outputs:
      ref: ${{ steps.lock.outputs.ref }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: lock
        run: echo "ref=$(tr -d '[:space:]' < engine.lock)" >> "$GITHUB_OUTPUT"

  python:
    uses: delphi-modernizer/.github/.github/workflows/python-ci.yml@78374692c4c7d78c93f578e43b262ca7818bdfb0
    with:
      sources: scripts

  build:
    needs: engine
    uses: delphi-modernizer/.github/.github/workflows/dotnet-ci.yml@78374692c4c7d78c93f578e43b262ca7818bdfb0
    with:
      solution: DelphiModernizer.Studio.slnx
      os: '["windows-latest"]'
      submodules: 'true'
      companion-repository: delphi-modernizer/engine
      companion-ref: ${{ needs.engine.outputs.ref }}
      companion-path: .engine
      sonar-organization: delphi-modernizer
      sonar-project-key: delphi-modernizer_studio
      sonar-exclusions: .engine/**
    secrets:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

  # The app with dmz beside it and the Windows App SDK runtime inside, so the artifact runs on a clean PC.
  package:
    needs: [engine, build]
    runs-on: windows-latest
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: "1"
      DOTNET_NOLOGO: "1"
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: delphi-modernizer/engine
          ref: ${{ needs.engine.outputs.ref }}
          path: .engine
          submodules: true
          persist-credentials: false
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          global-json-file: global.json
      - name: Publish the studio
        run: >-
          dotnet publish src/App/DelphiModernizer.Studio.App
          -c Release -r win-x64 -p:Platform=x64 --self-contained -o out/studio
      - name: Publish dmz beside it
        run: >-
          dotnet publish .engine/src/DelphiModernizer.Cli
          -c Release -r win-x64 --self-contained -p:PublishSingleFile=true -o out/studio/tools
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: delphi-modernizer-studio-win-x64
          path: out/studio
          if-no-files-found: error

  # Every page of the running app on the engine's sample workspace, uploaded as the artifact screenshots
  # (docs/design/ui-screenshots.md). It is also the job that fails when the app does not start or a page throws.
  screenshots:
    needs: [engine, build]
    runs-on: windows-latest
    timeout-minutes: 45
    permissions:
      contents: read
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: "1"
      DOTNET_NOLOGO: "1"
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: delphi-modernizer/engine
          ref: ${{ needs.engine.outputs.ref }}
          path: .engine
          submodules: true
          persist-credentials: false
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          global-json-file: global.json
      - name: Publish the studio and dmz
        run: |
          dotnet publish src/App/DelphiModernizer.Studio.App \
            -c Release -r win-x64 -p:Platform=x64 --self-contained -o out/studio
          dotnet publish .engine/src/DelphiModernizer.Cli \
            -c Release -r win-x64 --self-contained -p:PublishSingleFile=true -o out/studio/tools
      # The brief's sample: the engine's Delphi 7 ERP on the BDE, created and scanned by dmz as a person would.
      - name: Create the sample workspace
        env:
          GIT_AUTHOR_NAME: Studio screenshots
          GIT_AUTHOR_EMAIL: screenshots@delphi-modernizer.invalid
          GIT_COMMITTER_NAME: Studio screenshots
          GIT_COMMITTER_EMAIL: screenshots@delphi-modernizer.invalid
        run: |
          workspace="$RUNNER_TEMP/acme-erp"
          out/studio/tools/dmz.exe init "$workspace" \
            --name "Acme ERP modernization" \
            --legacy .engine/tests/fixtures/delphi/legacy-erp \
            --stack dotnet \
            --by "Studio screenshots <screenshots@delphi-modernizer.invalid>" \
            --domain "ERP, a Delphi 7 application on the BDE"
          out/studio/tools/dmz.exe scan --workspace "$workspace"
      - name: Capture every page
        run: >-
          dotnet run --project tests/DelphiModernizer.Studio.Screenshots -c Release --
          --app out/studio/DelphiModernizer.Studio.exe
          --workspace "$RUNNER_TEMP/acme-erp"
          --out out/screenshots
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ !cancelled() }}
        with:
          name: screenshots
          path: out/screenshots
          if-no-files-found: error

  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # A Private Use Area character is invisible in editors and diffs; glyphs are written as escapes.
      - name: Require icon glyphs to be written as escapes
        run: |
          if grep -rnP '[\x{E000}-\x{F8FF}]' --include='*.cs' --include='*.xaml' src tests; then exit 1; fi
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: '0.13.6'
      - name: Require the committed icon font to match its sources
        run: |
          uv run --frozen --no-build python scripts/build_icon_font.py
          git diff --exit-code -- src
      - name: Lint the Markdown
        run: |
          npm install --global --ignore-scripts markdownlint-cli2@0.24.0
          markdownlint-cli2
